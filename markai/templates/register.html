{% extends "base.html" %}
{% block title %}Create account · MarkAI{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="card">
    <h1>Create your account</h1>
    <p class="subtitle">Just an email and a password — no recovery flow yet.</p>
    <form method="post">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" minlength="6" required>
      <button class="btn" type="submit" style="width:100%;justify-content:center;">Create account</button>
    </form>
    <p style="margin-top:16px;font-size:13.5px;color:var(--text-muted);">
      Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
